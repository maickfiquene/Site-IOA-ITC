<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>(function(d){d.classList.add('js');if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&(!('onpagereveal' in window)||location.protocol==='file:'))d.classList.add('vt-fallback');setTimeout(function(){if(!d.classList.contains('motion'))d.classList.remove('js','vt-fallback')},3000)})(document.documentElement)</script>
  <title>Especializações odontológicas em São Luís · IOA/ITC</title>
  <meta name="description" content="Especialização em ortodontia, harmonização orofacial, odontopediatria, endodontia, radiologia, dentística, periodontia e prótese dentária em São Luís. Consulte turmas e valores.">
  <meta property="og:title" content="Especializações · IOA/ITC São Luís">
  <meta property="og:image" content="assets/img/fachada-noturna.jpg">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/motion.css">
</head>
<body data-page="especializacoes">
  <div id="site-header"></div>

  <main id="main">
    <section class="phero">
      <img class="phero__bg" src="assets/img/sala-aula-ioa-1.jpg" alt="" width="1280" height="853" fetchpriority="high">
      <div class="container phero__in">
        <span class="kicker">Especializações</span>
        <h1>Especializações odontológicas em São Luís</h1>
        <p class="lead" data-text="chamada2"></p>
      </div>
    </section>

    <section class="section" data-catalog aria-label="Catálogo de especializações">
      <div class="container">
        <div class="cat-tools">
          <div class="field search">
            <label for="busca" class="sr-only">Buscar especialização</label>
            <span data-icon="search"></span>
            <input id="busca" class="input" type="search" placeholder="Buscar por nome ou área" autocomplete="off">
          </div>
          <div class="field">
            <label for="ordem" class="sr-only">Ordenar</label>
            <select id="ordem" class="input">
              <option value="procurados">Mais procurados</option>
              <option value="az">Ordem alfabética</option>
            </select>
          </div>
          <button type="button" class="btn btn--ghost filters-btn" data-open-filters aria-controls="filtros" data-icon="filter">Filtros</button>
        </div>

        <div class="cat-layout">
          <aside class="filters" id="filtros" aria-label="Filtros" role="region">
            <div class="filters__head">
              <h2>Área</h2>
              <button type="button" class="icon-btn" data-close-filters aria-label="Fechar filtros" data-icon="close"></button>
            </div>
            <div data-areas role="group" aria-label="Filtrar por área"></div>
            <div class="filters__foot">
              <button type="button" class="btn btn--ghost btn--sm" data-clear>Limpar</button>
              <button type="button" class="btn btn--navy btn--sm" data-close-filters>Ver <span data-panel-count>0</span></button>
            </div>
          </aside>
          <div class="filters__scrim" data-close-filters></div>
          <div>
            <p class="cat-count" data-count-results aria-live="polite"></p>
            <div class="grid results" data-results></div>
          </div>
        </div>
      </div>

      <div class="cmp-bar" data-cmp-bar hidden>
        <div class="container cmp-bar__in">
          <span class="cmp-bar__t">Comparar <span data-cmp-n>0/3</span></span>
          <ul data-cmp-list aria-label="Especializações selecionadas"></ul>
          <div class="cmp-bar__act">
            <button type="button" class="btn btn--sm btn--ghost-lt" data-cmp-clear>Limpar</button>
            <button type="button" class="btn btn--sm btn--gold" data-cmp-go>Comparar</button>
          </div>
          <p class="cmp-msg" data-cmp-msg aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/motion.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/chatbot.js" defer></script>
  <script src="js/catalog.js" defer></script>
</body>
</html>
